services:
  postgres:
    image: postgres:15-alpine
    container_name: jobscout-postgres
    environment:
      POSTGRES_DB: jobscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: jobscout-backend
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/jobscout
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    shm_size: "2gb"
    tmpfs:
      - /tmp:exec,size=1g
    restart: unless-stopped

  telegram-bot:
    container_name: jobscout-telegram-bot
    build: ./telegram-bot
    env_file:
      - .env
    environment:
      API_URL: "http://backend:8000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
